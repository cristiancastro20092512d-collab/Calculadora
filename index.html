<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
    <script src="codigo.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="Padre bg-light d-flex justify-content-center align-items-center vh-100">
    <div class="Calculadora">
        <div class="card shadow" style="width: 20rem;"> 
            <div class="card-body d-flex justify-content-center align-items-center" style="height: 70px;">
                <input id="PANTALLA" type="text" class="form-control text-center fs-4" placeholder="0">
            </div>
            <div class="card-buttoms-fila1 text-center">
                <input type="button" class="" value="1" style="width: 60px; margin: 5px; height: 50px;">
                <input type="button" class="" value="2" style="width: 60px; margin: 5px; height: 50px;">
                <input type="button" class="" value="3" style="width: 60px; margin: 5px; height: 50px;">
            </div>
            <div class="card-buttoms-fila2 text-center">
                <input type="button" class="" value="4" style="width: 60px; margin: 5px; height: 50px;">
                <input type="button" class="" value="5" style="width: 60px; margin: 5px; height: 50px;">
                <input type="button" class="" value="6" style="width: 60px; margin: 5px; height: 50px;">
            </div>
            <div class="card-buttoms-fila3 text-center">
                <input type="button" class="" value="7" style="width: 60px; margin: 5px; height: 50px;">
                <input type="button" class="" value="8" style="width: 60px; margin: 5px; height: 50px;">
                <input type="button" class="" value="9" style="width: 60px; margin: 5px; height: 50px;">
            </div>
            <div class="card-buttoms-fila4 text-center mb-3">
                <input type="button" id="Boton" class="" value="0" style="width: 60px; margin: 5px; height: 50px;">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
